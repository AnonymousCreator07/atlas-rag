[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "atlas-rag"
version = "0.2.0"
description = "An end-to-end, inspectable retrieval-augmented generation system for learning and engineering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "chromadb>=0.6,<2", "openai>=1.60,<3", "sentence-transformers>=3.4,<6",
  "pypdf>=5.2,<7", "python-docx>=1.1,<2", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
