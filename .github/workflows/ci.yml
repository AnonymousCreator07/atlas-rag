name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Run offline workflow evaluation
        run: python scripts/run_workflow_eval.py --k 5
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-rag-evaluation
          path: evaluation/latest.json
